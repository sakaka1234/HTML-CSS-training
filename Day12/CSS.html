<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel = "stylesheet" type="text/css" href="mystyle.css">
    <title>Document</title>
</head>
<body>
    <div id = "Creating a CSS stylesheet">
        <!-- This is also an example of external text -->
        <p id = "text1">Example Text 1</p>
        <p id = "text2">Example Text 2</p>
    </div>
    <div id ="Importing stylesheet and using style tag">
        <p style="color:aquamarine;"> Example of an inline style</p>
        <p id = "text3">Example of an internal style</p>
        <style>
            #text3{
                color: yellowgreen;
            }
        </style>
    </div>
    <div id = "CSS syntax">
        <p>Example of referencing an element by tag</p>
        <p id="text">Example of referencing an element by id</p>
        <p class="text4">Example of referencing an element by class</p>
        <style>
            p{color: blue;}
            #text{
                color: cadetblue;
            }
            #text4{
                color:darkgreen;
            }
        </style>
    </div>
</body>
</html>
