<div class="hero__wrapper">
  <div class="hero__image">
    <img src="../assets/img/workerdoor.png" class="worker-image-left" />
  </div>
  <div class="hero__content">
    <div class="benefit">
      <span>Maintenances</span>
      <span class="dot"></span>
      <span>Repairs</span>
      <span class="dot"></span>
      <span>Improvements</span>
    </div>
    <div class="title">
      <div>Need Improvement</div>
      <div>or repair your home ?</div>
      <div>we can help!</div>
    </div>
    <div class="guarantee">
      <!-- <span class="guarantee__icon"></span> -->
      <span class="guarantee__text">Free quotes</span>

      <span class="guarantee__text">100% Commitment-Free</span>
    </div>
    <div class="btn">
      <span class="text">Call Us Now</span>
      <div class="icon">
        <img src="../assets/icon/phoneContact.svg" />
      </div>
    </div>
  </div>
  <div class="hero__image">
    <img src="../assets/img/workertoilet.png" class="worker-image-right" />
  </div>

  <div class="feature-bar">
    <include
      src="./components/heroFeatureBar.html"
      locals='{
      "hero":[
        {
          "id":"guarantee1",
          "image":"24-Guarantee",
          "text":["Satisfaction","Guarantee"]
        },
        {
          "id":"clock",
          "image":"24-Clock",
          "text":["24H","Availability"]
        },
        {
          "id":"map-pin",
          "image":"24-Map-pin",
          "text":["Local US","Professional"]
        }
      ]
    }'
    >
    </include>

    <div class="group" id="calendar">
      <figure class="feature-icon">
        <img src="../assets/icon/24-Calendar.svg" />
      </figure>
      <span
        >Flexible<br />
        Appointments</span
      >
    </div>
  </div>
  <div class="hero__devider">
    <span class="newdeviderX"></span>
    <span class="newdeviderY"></span>
  </div>
</div>
