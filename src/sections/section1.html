<header class="header">
    <div class="container">
        <div class="header__wrapper">
            <div class="header__logo">
                <a href="/">
                    <!-- Logo placeholder -->
                    <span class="logo-icon"></span>
                    <span class="logo-text">HomePro</span>
                </a>
            </div>
            
            <nav class="header__nav">
                <ul>
                    <li><a href="#about">About Us</a></li>
                    <li><a href="#services">Services</a></li>
                    <li><a href="#blog">Our Blog</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
            </nav>
            
            <div class="header__service-hours">
                <!-- Icon placeholder -->
                <span class="service-icon"></span>
                <span>24 Hour Services</span>
            </div>
        </div>
    </div>
</header>

<!-- Hero Section -->
<section class="hero">
    <div class="container">
        <div class="hero__wrapper">
            <!-- Left worker image -->
            <div class="hero__image hero__image--left">
                <!-- Image will be added via CSS background or you can use an img tag -->
            </div>
            
            <!-- Hero Content -->
            <div class="hero__content">
                <div class="hero__categories">
                    <span>Maintenances</span>
                    <span class="dot"></span>
                    <span>Repairs</span>
                    <span class="dot"></span>
                    <span>Improvements</span>
                </div>
                
                <h1 class="hero__title">
                    Need improvement<br>
                    or repair your home?<br>
                    we can help!
                </h1>
                
                <div class="hero__features">
                    <div class="feature">
                        <span class="feature__icon feature__icon--check"></span>
                        <span class="feature__text">Free Quotes</span>
                    </div>
                    <div class="feature">
                        <span class="feature__icon feature__icon--check"></span>
                        <span class="feature__text">100% Commitment-Free</span>
                    </div>
                </div>
                
                <div class="hero__cta">
                    <a href="#contact" class="btn btn-primary">
                        Call Us Now
                        <span class="btn-icon"></span>
                    </a>
                </div>
            </div>
            
            <!-- Right worker image -->
            <div class="hero__image hero__image--right">
                <!-- Image will be added via CSS background or you can use an img tag -->
            </div>
        </div>
        
        <!-- Features Bar -->
        <div class="features-bar">
            <div class="feature-item">
                <span class="feature-item__icon"></span>
                <div class="feature-item__content">
                    <h3>Satisfaction Guarantee</h3>
                </div>
            </div>
            
            <div class="feature-item">
                <span class="feature-item__icon"></span>
                <div class="feature-item__content">
                    <h3>24H Availability</h3>
                </div>
            </div>
            
            <div class="feature-item">
                <span class="feature-item__icon"></span>
                <div class="feature-item__content">
                    <h3>Local US Professional</h3>
                </div>
            </div>
            
            <div class="feature-item">
                <span class="feature-item__icon"></span>
                <div class="feature-item__content">
                    <h3>Flexible Appointments</h3>
                </div>
            </div>
        </div>
    </div>
</section>
